name: Everpure Ansible CI

"on":
  pull_request:
  push:
  schedule:
    - cron: '25 10 * * *'

permissions:
  contents: read

jobs:
  build:
    name: Build flasharray on Ansible ${{ matrix.ansible }} (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # ansible-core versions worth testing in October 2026: 2.16 is the
        # default core of AAP 2.5/2.6/2.7 and the lowest requires_ansible
        # allows, 2.18 and 2.20 are AAP execution-environment streams, 2.21 is
        # the current upstream release and devel is the next one.  2.17 and
        # 2.19 are end of life upstream and not shipped by AAP.
        ansible:
          - stable-2.16
          - stable-2.18
          - stable-2.20
          - stable-2.21
          - devel
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
        # Control-node Python per ansible-core: 2.16 supports 3.10-3.12,
        # 2.18 3.11-3.13, 2.20 and 2.21 3.12-3.14, devel needs 3.13+.
        exclude:
          - python-version: "3.13"
            ansible: stable-2.16
          - python-version: "3.14"
            ansible: stable-2.16
          - python-version: "3.14"
            ansible: stable-2.18
          - python-version: "3.12"
            ansible: devel
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install https://github.com/ansible/ansible/archive/${{ matrix.ansible }}.tar.gz --disable-pip-version-check

    - name: Run sanity tests
      run: |
        pwd
        mkdir -p ansible_collections/everpure/flasharray
        rsync -av . ansible_collections/everpure/flasharray --exclude /ansible_collections
        cd ansible_collections/everpure/flasharray
        ansible-test sanity -v --color --python ${{ matrix.python-version }} --docker

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r tests/requirements.txt

    - name: Run unit tests with coverage
      run: |
        pytest tests/ --cov=plugins --cov-report=html --cov-report=xml --cov-report=term -v --ignore=collections

    - name: Upload coverage report (HTML)
      if: matrix.python-version == '3.12'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-html
        path: htmlcov/

    - name: Upload coverage report (XML)
      if: matrix.python-version == '3.12'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-xml
        path: coverage.xml

    - name: Display coverage summary
      run: |
        echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        coverage report >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
