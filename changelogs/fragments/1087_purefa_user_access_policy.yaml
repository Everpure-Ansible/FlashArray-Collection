minor_changes:
  - purefa_user - add ``access_policy`` to make a local user a member of a
    custom management access policy instead of giving it a built-in ``role``
    (requires REST 2.36). The user is then limited to what the policy grants,
    for example a user scoped to one realm for Portworx/PX-CSI secure
    multi-tenancy. ``role`` and ``access_policy`` are mutually exclusive.
  - purefa_user - a new user still gets ``readonly`` when neither ``role`` nor
    ``access_policy`` is set, but an existing user's role or policy is now only
    changed when one of them is given. Before, omitting ``role`` reset an
    existing user to ``readonly``.
bugfixes:
  - purefa_user - setting ``role`` on a local user whose access comes from a
    custom management access policy failed with ``User is not a role user``.
    The user is now moved to the built-in policy of that role.
