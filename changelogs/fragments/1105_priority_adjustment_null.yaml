bugfixes:
  - purefa_info - the ``volumes`` and ``vgroups`` subsets, and so
    ``gather_subset=all``, failed with ``AttributeError`` on Purity//FA 6.12,
    which reports a volume or volume group with no priority adjustment as
    operator ``=`` with a null value. The fields are now read with a
    default, and an unset adjustment is reported as ``+0`` as on older
    releases.
  - purefa_volume - on Purity//FA 6.12 every call on an existing volume
    failed with ``AttributeError`` after the requested change had already
    been applied, including the eradication of a destroyed volume, because
    the module read a null ``priority_adjustment_value`` directly. The
    returned ``priority_operator`` and ``priority_value`` facts report an
    unset adjustment as ``+`` and ``0`` as on older releases.
  - purefa_volume - Purity//FA 6.12 stores every priority adjustment with
    the ``=`` operator, so a task asking for ``+10`` read back as ``=10``
    and was applied again on every run. On 6.12 and later the requested
    adjustment is now compared with the form the array stores. ``=0`` stays
    a distinct explicit pin.
  - purefa_vg - any task on an existing volume group failed with
    ``AttributeError`` on Purity//FA 6.12, in check mode too, for the same
    reason as purefa_volume. The priority comparison follows the same rule
    as purefa_volume.
  - purefa_vg - on a standalone array (not a fleet member) with REST 2.38 or
    later, every priority or QoS update failed with ``Unidentified internal
    error``, because the module sent an empty fleet context name with the
    request. The context is now only sent when the task gives one.
