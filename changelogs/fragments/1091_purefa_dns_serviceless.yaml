minor_changes:
  - purefa_dns - the ``service`` option no longer defaults to ``management``.
    Omitting it creates a DNS configuration with no service, which is what
    every file server after the first uses through the ``dns`` option of
    ``purefa_server``. A play that gave a custom ``name`` without ``service``
    used to have the name rewritten to ``management``; it now creates a
    configuration with that name, so add ``service=management`` or use the
    ``management`` name directly where the management DNS was meant. The
    limit of two configurations is removed; the array itself enforces one
    configuration per service.
  - purefa_info - the ``dns`` section of the ``config`` subset reports
    ``name`` and ``services`` for each configuration, and lists a
    configuration with no service under its name.
bugfixes:
  - purefa_dns - updating a configuration failed with "Changing service type
    is not permitted" when it carried more than one service, as the
    management configuration does on arrays where it also serves files.
  - purefa_dns - deleting a configuration name that does not exist is no
    longer redirected to the management configuration, which emptied the
    management DNS.
  - purefa_dns - emptying the management configuration now honours check mode.
  - purefa_info - the ``config`` subset failed with an IndexError when the
    array had a DNS configuration with no service.
