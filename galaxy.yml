namespace: everpure
name: flasharray
version: 1.45.1
readme: README.md
authors:
  - Everpure Ansible Team <pure-ansible-team@everpuredata.com>
description: Collection of modules to manage Everpure FlashArrays (including Cloud Block Store)
license:
  - GPL-3.0-or-later
  - BSD-2-Clause
tags:
  - everpure
  - purestorage
  - flasharray
  - cloudblockstore
  - storage
dependencies: {}
repository: https://github.com/Everpure-Ansible/FlashArray-Collection
documentation: https://github.com/Everpure-Ansible/FlashArray-Collection
issues: https://github.com/Everpure-Ansible/FlashArray-Collection/issues
build_ignore:
  - tests/integration
  - tests/unit
  - extensions/molecule
  - docs
  - collections
  - .github
  - .ansible
  - .tox
  - .venv
  - .vscode
  - .pytest_cache
  - .pre-commit-config.yaml
  - settings.json
  # Release archives. ansible-galaxy already skips its own
  # everpure-flasharray-*.tar.gz, which is why only the retired
  # purestorage-namespaced archive was picked up into 1.45.0.
  - "*.tar.gz"
  - "*.tgz"
  - "*.zip"
  # Repository-only dotfiles that are not user facing
  - .gitignore
  - .git-blame-ignore-revs
  - .yamllint
  # changelogs/changelog.yaml ships deliberately, alongside the rendered
  # CHANGELOG.rst. These two do not: .plugin-cache.yaml is antsibull-changelog
  # tooling state, and fragments are unreleased notes by definition.
  - changelogs/.plugin-cache.yaml
  - changelogs/config.yaml
  - changelogs/fragments
  # Empty scaffolding kept in git only so the directories exist. Excluding the
  # placeholders leaves the directories empty, so they are not archived at all.
  - "**/.keep"
  # tests/unit is excluded above, and tests/README.md documents it in detail -
  # per-module coverage tables and pytest paths that do not exist in the build
  - tests/README.md
